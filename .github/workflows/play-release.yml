name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: MrJackSpade/Kairo/.github/workflows/app-play-release.yml@8aeca1c2dcb1a4b47f41ed5e5e743f934f41267c
    with:
      name: Kairo68
      package: com.loxifi.kairo68
      tag: ${{ inputs.tag }}
